<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Selection Way - Batch Details</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#fdfbf7;color:#333;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;padding:16px 20px;box-shadow:0 2px 8px rgba(139,69,19,.08);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0e6d2}
.brand{font-size:20px;font-weight:800;color:#8B4513;letter-spacing:0.5px}
.brand span{color:#D2B48C}
.devcoderz-brand{font-size:12px;font-weight:700;color:#00e5ff;text-shadow:0 0 6px rgba(0,229,255,0.6)}

.container{max-width:1000px;margin:20px auto;padding:0 16px;flex:1;width:100%}
.banner{width:100%;height:200px;background:#f5ebe0;border-radius:14px;object-fit:cover;margin-bottom:16px;border:1px solid #f3e9dc}
.course-title{font-size:20px;font-weight:800;color:#2c1810;margin-bottom:6px}
.course-desc{font-size:13px;color:#7a6b63;margin-bottom:16px;line-height:1.5}

/* Tabs */
.tabs{display:flex;gap:10px;border-bottom:2px solid #f0e6d2;margin-bottom:20px}
.tab-btn{background:none;border:none;padding:10px 16px;font-size:14px;font-weight:700;color:#a89f91;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:0.2s}
.tab-btn.active{color:#8B4513;border-bottom-color:#8B4513}

.tab-content{display:none}
.tab-content.active{display:block}

/* Cards / Items */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(139,69,19,.04);border:1px solid #f3e9dc}
.item-title{font-size:14px;font-weight:700;color:#2c1810;margin-bottom:4px}
.item-sub{font-size:12px;color:#7a6b63;margin-bottom:8px}
.btn-action{display:inline-block;background:#8B4513;color:#fff;text-decoration:none;padding:6px 12px;font-size:11px;font-weight:700;border-radius:6px;transition:background 0.2s}
.btn-action:hover{background:#6b3410}

.loader{text-align:center;padding:40px;font-size:14px;color:#8B4513}
footer{background:#fff;border-top:1px solid #f0e6d2;text-align:center;padding:16px;margin-top:40px}
footer .jsr{color:#ff9800;font-weight:700;font-size:13px;margin-bottom:4px}
footer .dev{font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 4px rgba(0,229,255,0.6)}
</style>
</head>
<body>

<header>
 <div class="brand" style="cursor:pointer" onclick="location.href='index.html'">Selection <span>Way</span></div>
 <div class="devcoderz-brand">DevCoderZ</div>
</header>

<div class="container">
 <div id="loader" class="loader">Loading batch details...</div>
 <div id="mainContent" style="display:none">
  <img id="courseBanner" class="banner" src="" alt="Banner">
  <div class="course-title" id="courseTitle"></div>
  <div class="course-desc" id="courseDesc"></div>

  <!-- Tabs Header -->
  <div class="tabs">
   <button class="tab-btn active" onclick="switchTab('overview', this)">Overview</button>
   <button class="tab-btn" onclick="switchTab('notes', this)">Notes (PDFs)</button>
   <button class="tab-btn" onclick="switchTab('videos', this)">Videos</button>
  </div>

  <!-- Overview Tab -->
  <div id="overview" class="tab-content active">
   <div class="card">
    <div class="item-title">Batch Highlights</div>
    <ul id="highlightsList" style="padding-left:20px;font-size:13px;color:#5c3a21;line-height:1.6"></ul>
   </div>
   <div class="card">
    <div class="item-title">Faculty Information</div>
    <p id="facultyInfo" style="font-size:13px;color:#5c3a21;line-height:1.5"></p>
   </div>
  </div>

  <!-- Notes Tab -->
  <div id="notes" class="tab-content">
   <div id="notesList">Loading notes...</div>
  </div>

  <!-- Videos Tab -->
  <div id="videos" class="tab-content">
   <div id="videosList">Loading classes...</div>
  </div>
 </div>
</div>

<footer>
 <div class="jsr">🚩 Jai Shree Ram 🚩</div>
 <div class="dev">Developed by - Devansh Sharma (The DevCoderZ)</div>
</footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const courseId = urlParams.get('id') || '69d4b8c322cc6f4d5f00839f';

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

async function loadBatchData() {
    try {
        // 1. Fetch Course Info (Overview)
        const res = await fetch(`https://backend.multistreaming.site/api/courses/${courseId}`);
        const json = await res.json();
        
        if(json && json.data) {
            const data = json.data;
            document.getElementById('courseBanner').src = data.banner || data.bannerSquare || '';
            document.getElementById('courseTitle').innerText = data.title;
            document.getElementById('courseDesc').innerText = data.description.join(' | ');

            const highlights = document.getElementById('highlightsList');
            highlights.innerHTML = '';
            (data.courseHighlights || []).forEach(h => {
                let li = document.createElement('li');
                li.innerText = h;
                highlights.appendChild(li);
            });

            if(data.facultyDetails) {
                document.getElementById('facultyInfo').innerHTML = `<b>${data.facultyDetails.name}</b> (${data.facultyDetails.designation})<br>${data.facultyDetails.description || data.facultyDetails.bio || ''}`;
            }
        }

        // 2. Fetch PDFs (Notes)
        const pdfRes = await fetch(`https://gdgoenkaratia.com/api/courses/${courseId}/pdfs?groupBy=topic`);
        const pdfJson = await pdfRes.json();
        const notesContainer = document.getElementById('notesList');
        notesContainer.innerHTML = '';
        
        // Handle array or object response structure safely
        let pdfs = Array.isArray(pdfJson) ? pdfJson : (pdfJson.data || []);
        if(pdfs.length > 0) {
            pdfs.forEach(pdf => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="item-title">${pdf.title}</div>
                    <div class="item-sub">${pdf.description || ''}</div>
                    <a class="btn-action" href="${pdf.uploadPdf}" target="_blank">Download PDF</a>
                `;
                notesContainer.appendChild(card);
            });
        } else {
            notesContainer.innerHTML = '<div class="card">No notes available.</div>';
        }

        // 3. Fetch Videos / Classes
        const vidRes = await fetch(`https://backend.multistreaming.site/api/courses/${courseId}/classes?populate=full`);
        const vidJson = await vidRes.json();
        const videosContainer = document.getElementById('videosList');
        videosContainer.innerHTML = '';

        let classes = Array.isArray(vidJson) ? vidJson : (vidJson.data || []);
        if(classes.length > 0) {
            classes.forEach(cls => {
                let videoLink = cls.class_link || (cls.mp4Recordings && cls.mp4Recordings.length > 0 ? cls.mp4Recordings[0].url : '#');
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="item-title">${cls.title}</div>
                    <div class="item-sub">Teacher: ${cls.teacherName || 'Gagan Pratap'}</div>
                    <a class="btn-action" href="${videoLink}" target="_blank">Watch Class</a>
                `;
                videosContainer.appendChild(card);
            });
        } else {
            videosContainer.innerHTML = '<div class="card">No classes available.</div>';
        }

        document.getElementById('loader').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

    } catch(e) {
        document.getElementById('loader').innerText = "Failed to load batch data.";
    }
}

loadBatchData();
</script>

</body>
</html>
