<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Selection Way - Explore Batches</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#fdfbf7;color:#333;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;padding:16px 20px;box-shadow:0 2px 8px rgba(139,69,19,.08);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0e6d2}
.brand{font-size:20px;font-weight:800;color:#8B4513;letter-spacing:0.5px}
.brand span{color:#D2B48C}
.devcoderz-brand{font-size:12px;font-weight:700;color:#00e5ff;text-shadow:0 0 6px rgba(0,229,255,0.6)}
.container{max-width:1200px;margin:20px auto;padding:0 16px;flex:1;width:100%}
.heading{font-size:18px;font-weight:700;color:#5c3a21;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(139,69,19,.06);border:1px solid #f3e9dc;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(139,69,19,.12)}
.card-img{width:100%;height:150px;background:#f5ebe0;object-fit:cover;display:block}
.card-body{padding:14px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.badge{display:inline-block;background:#fdf3e6;color:#b86b25;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;margin-bottom:8px;align-self:flex-start}
.title{font-size:15px;font-weight:700;color:#2c1810;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:12px;color:#7a6b63;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.footer-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f5ede2;padding-top:10px;margin-top:auto}
.price-box{display:flex;align-items:baseline;gap:6px}
.discount{font-size:16px;font-weight:800;color:#8B4513}
.price{font-size:12px;color:#a89f91;text-decoration:line-through}
.btn-view{background:#8B4513;color:#fff;border:none;padding:8px 14px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;transition:background .2s}
.btn-view:hover{background:#6b3410}
.loader{text-align:center;padding:50px;font-size:14px;color:#8B4513}
footer{background:#fff;border-top:1px solid #f0e6d2;text-align:center;padding:16px;margin-top:40px}
footer .jsr{color:#ff9800;font-weight:700;font-size:13px;margin-bottom:4px}
footer .dev{font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 4px rgba(0,229,255,0.6)}
</style>
</head>
<body>

<header>
 <div class="brand">Selection <span>Way</span></div>
 <div class="devcoderz-brand">DevCoderZ</div>
</header>

<div class="container">
 <div class="heading">🔥 Explore All Batches</div>
 <div id="loader" class="loader">Loading batches...</div>
 <div class="grid" id="courseGrid"></div>
</div>

<footer>
 <div class="jsr">🚩 Jai Shree Ram 🚩</div>
 <div class="dev">Developed by - Devansh Sharma (The DevCoderZ)</div>
</footer>

<script>
async function fetchCourses() {
    try {
        const res = await fetch("https://devcoderz-sw.vercel.app/api/hehe?path=courses/
");
        const json = await res.json();
        const grid = document.getElementById("courseGrid");
        const loader = document.getElementById("loader");
        loader.style.display = "none";

        if(json && json.data) {
            json.data.forEach(course => {
                let bannerImg = course.banner || course.bannerSquare || "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=500&auto=format&fit=crop&q=60";
                let disc = course.discountPrice !== null ? `₹${course.discountPrice}` : 'Free';
                let orig = course.price ? `₹${course.price}` : '';
                
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img class="card-img" src="${bannerImg}" alt="Banner">
                    <div class="card-body">
                        <div>
                            <span class="badge">${course.mainCategory ? course.mainCategory.mainCategoryName : 'GENERAL'}</span>
                            <div class="title">${course.title}</div>
                            <div class="desc">${course.short_description || course.description.join(', ')}</div>
                        </div>
                        <div class="footer-row">
                            <div class="price-box">
                                <span class="discount">${disc}</span>
                                <span class="price">${orig}</span>
                            </div>
                            <button class="btn-view" onclick="location.href='batch.html?id=${course.id}'">View Batch</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    } catch(e) {
        document.getElementById("loader").innerText = "Failed to load courses. Please check connection.";
    }
}

fetchCourses();
</script>

</body>
</html>
